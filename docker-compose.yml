name: farejador
services:
    farejador:
        build:
            context: /DATA/AppData/Farejador
            dockerfile: Dockerfile
        cpu_shares: 90
        command:
            - uvicorn
            - --factory
            - farejador.web:criar_app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --reload
            - --reload-dir
            - /app/farejador
        container_name: farejador
        deploy:
            resources:
                limits:
                    memory: "1073741824"
        environment:
            FAREJADOR_LLM_MODEL: google/gemma-4-e4b
            FAREJADOR_LLM_URL: http://192.168.0.6:1234
            FAREJADOR_METUBE_AO_APROVAR: "false"
            FAREJADOR_METUBE_CODEC: h264
            FAREJADOR_METUBE_FORMATO: mp4
            FAREJADOR_METUBE_INTERVALO: "1440"
            FAREJADOR_METUBE_MODO: assinar
            FAREJADOR_METUBE_QUALIDADE: "1080"
            FAREJADOR_METUBE_URL: http://192.168.0.11:8081
            TZ: America/Sao_Paulo
        hostname: farejador
        image: farejador:prd
        networks:
            default: null
        ports:
            - mode: ingress
              target: 8000
              published: "8765"
              protocol: tcp
        restart: unless-stopped
        user: 1000:1000
        volumes:
            - type: bind
              source: /DATA/AppData/Farejador/data
              target: /data
              bind:
                create_host_path: true
            - type: bind
              source: /DATA/AppData/Farejador/farejador
              target: /app/farejador
              read_only: true
              bind:
                create_host_path: true
networks:
    default:
        name: farejador_default
x-casaos:
    author: self
    category: self
    hostname: 192.168.0.11
    icon: ""
    index: /
    is_uncontrolled: false
    port_map: "8765"
    scheme: http
    title:
        custom: Farejador Pessoal
