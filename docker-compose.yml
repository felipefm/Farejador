# Exemplo para o homelab. Na pasta do projeto: docker compose up -d --build
services:
  farejador:
    build: .
    image: farejador
    container_name: farejador
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      # LLM local (LM Studio). Vazio = desligado.
      FAREJADOR_LLM_URL: http://192.168.0.6:1234
      FAREJADOR_LLM_MODEL: google/gemma-4-e4b
      # MeTube. Vazio = desligado. Ligado, "Aprovar" já envia o canal.
      # assinar = só vídeos novos | baixar = os últimos FAREJADOR_METUBE_LIMITE vídeos
      FAREJADOR_METUBE_URL: ""            # ex.: http://192.168.0.11:8081
      FAREJADOR_METUBE_MODO: assinar
      # Demais variáveis (pausa, cache, limites): ver README, seção Configuração.
    user: "1000:1000"   # dono dos arquivos em ./data
    ports:
      - "8765:8000"
    volumes:
      - ./data:/data              # SQLite, cache do yt-dlp, exclude.txt, bruto/
      - ./farejador:/app/farejador:ro   # código montado: mudou, recarrega (sem rebuild)
    # --reload vigia só o pacote (polling leve, sem dependências extras).
    # Atenção: recarregar no meio de uma descoberta a interrompe (fica marcada como 'interrompida').
    command: >
      uvicorn --factory farejador.web:criar_app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/farejador
    mem_limit: 512m
